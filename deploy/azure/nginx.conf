# nginx for the demonstration container, run as the unprivileged django user.
# Azure's ingress terminates TLS and forwards plain HTTP to port 8080.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_max_body_size 20m;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build files never change; everything else is checked on each load.
  map $uri $cache_control {
    ~remoteEntry\.js$                       "no-cache";
    ~^/(assets|plugins/radsmart/assets)/    "public, max-age=31536000, immutable";
    default                                 "no-cache";
  }

  upstream care_api { server 127.0.0.1:9000; keepalive 8; }

  server {
    listen 8080;
    root /srv/www;
    absolute_redirect off;   # behind Azure's ingress: keep redirects on the visitor's own address

    # The front door: the one-click demonstration and the way in for real use (the plugin's
    # tryout.py). The CARE app itself is one click further.
    location = / { return 302 /try/; }
    location ~ ^/try/?$ { return 302 /api/care_radsmart/try/; }

    # Everyone who tries the demonstration shares its accounts: nobody may change their
    # password or add a second factor here, so the accounts keep working for everyone.
    location ~ ^/api/v1/(password_change|password_reset|mfa/totp)/ { return 403; }

    # CARE's API (the plugin's API and the patient pages are under /api/care_radsmart/),
    # Django admin and static files, and the health checks.
    location ~ ^/(api|admin|staticfiles|health|ping|app_version)/ {
      proxy_pass http://care_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 120s;
    }

    # Build files, and the plugin's remote entry and translations: a missing file is a 404.
    location ~ ^/(assets|plugins)/ {
      add_header Cache-Control $cache_control;
      add_header X-Content-Type-Options nosniff;
      try_files $uri =404;
    }

    # CARE's single-page app.
    location / {
      add_header Cache-Control $cache_control;
      add_header X-Content-Type-Options nosniff;
      add_header Referrer-Policy strict-origin-when-cross-origin;
      try_files $uri /index.html;
    }
  }
}
