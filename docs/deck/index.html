<figure class="slide" id="s2" aria-label="Slide 2 of 8"><div class="frame"><div class="canvas"><section id="problem" data-transition="fade" style="background:#FCFCFB; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px">
  <div style="display:flex; flex-direction:column; gap:16px">
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#1C5CAB">The problem</p>
    <h2 style="font-family:'Source Serif 4', Georgia, serif; font-size:56px; font-weight:600; line-height:1.1; color:#132238">Every weekday, 70–90 patients wait for one machine</h2>
  </div>
  <p style="font-size:30px; line-height:1.4; color:#3B4654">Appointment times are given by hand, without knowing how many machine-minutes each patient needs. Too many people are told to come at once, and they wait, every day of a 5–7 week course, usually with a caregiver.</p>
  <div style="display:flex; flex-direction:column; gap:16px">
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#5F6B7A">Our department's records · 55 days, Oct–Dec 2024 · 3,137 patient-days</p>
    <div style="display:flex; flex-direction:row; gap:32px">
      <div style="flex:1; display:flex; flex-direction:column; gap:12px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:36px 40px">
        <p style="font-family:'Source Serif 4', Georgia, serif; font-size:72px; font-weight:600; line-height:1.05; color:#132238">109 min</p>
        <p style="font-size:28px; line-height:1.4; color:#3B4654">one patient in ten waits longer than this, from arrival to treatment</p>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:12px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:36px 40px">
        <p style="font-family:'Source Serif 4', Georgia, serif; font-size:72px; font-weight:600; line-height:1.05; color:#132238">22%</p>
        <p style="font-size:28px; line-height:1.4; color:#3B4654">treated more than an hour after their appointment; only 29% within 15 minutes</p>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; gap:12px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:36px 40px">
        <p style="font-family:'Source Serif 4', Georgia, serif; font-size:72px; font-weight:600; line-height:1.05; color:#132238">19 → 66 min</p>
        <p style="font-size:28px; line-height:1.4; color:#3B4654">median wait, arriving before 10:00 against after 19:00: delays build all day</p>
      </div>
    </div>
  </div>
  <p style="font-size:26px; line-height:1.4; color:#3B4654">The load is rising, from 54 patients a weekday in October to 67 in December, and busy days are worse. 69% of India's 554 radiotherapy facilities have only one machine.</p>
  <div style="position:absolute; left:128px; right:128px; bottom:64px; display:flex; flex-direction:row; justify-content:space-between; gap:32px">
    <p style="font-size:24px; color:#5F6B7A">Sources: department records (anonymised, aggregates only); problem statement (Dr A. Dinesan); J Med Phys 2024</p>
    <p style="font-size:24px; color:#5F6B7A; white-space:nowrap">2 / 8</p>
  </div>
  <aside>The department's own records show a daily pain that grows through the day: patients arriving before 10:00 wait a median of about 19 minutes, those arriving after 19:00 about 66, and evening patients now come about half an hour early to protect their place. A patient on a 25-fraction course who waits an extra hour a day loses about 25 hours, and so does the family member who comes along. Most Indian centres have one machine, so one bad day affects everyone.</aside>
</section></div></div><details class="notes"><summary>Speaker notes</summary><p>The department's own records show a daily pain that grows through the day: patients arriving before 10:00 wait a median of about 19 minutes, those arriving after 19:00 about 66, and evening patients now come about half an hour early to protect their place. A patient on a 25-fraction course who waits an extra hour a day loses about 25 hours, and so does the family member who comes along. Most Indian centres have one machine, so one bad day affects everyone.</p></details></figure>
<figure class="slide" id="s3" aria-label="Slide 3 of 8"><div class="frame"><div class="canvas"><section id="constraints" data-transition="fade" style="background:#EEF2F6; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px">
  <div style="display:flex; flex-direction:column; gap:16px">
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#1C5CAB">Why it is hard</p>
    <h2 style="font-family:'Source Serif 4', Georgia, serif; font-size:56px; font-weight:600; line-height:1.1; color:#132238">Allocation under hard rules and soft priorities</h2>
  </div>
  <div style="display:flex; flex-direction:row; gap:32px">
    <div style="flex:1; display:flex; flex-direction:column; gap:16px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:36px 40px">
      <h3 style="font-family:'Source Serif 4', Georgia, serif; font-size:34px; font-weight:600; line-height:1.2; color:#132238">Hard rules: never broken</h3>
      <ul style="font-size:26px; line-height:1.4; color:#3B4654"><li>New starts finish by 17:00</li><li>SBRT, SRT, TBI, CSI in 10:00–17:00</li><li>Blood irradiation 13:30–14:00, daily</li><li>1 breast board, 1 ABC, shared with CT</li><li>MHRC: 16:00–17:00, then the 17:00 bus</li><li>Public transport home by 21:00</li><li>Urgent starts treated by 18:00</li></ul>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:16px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:36px 40px">
      <h3 style="font-family:'Source Serif 4', Georgia, serif; font-size:34px; font-weight:600; line-height:1.2; color:#132238">Soft priorities: traded off</h3>
      <ul style="font-size:26px; line-height:1.4; color:#3B4654"><li>Paying patients' preferred times</li><li>Older patients earlier</li><li>Ward, dormitory, nearby: late evening</li><li>Complex cases in 12:00–13:30</li><li>A day of 08:30 to 01:00, little overtime</li></ul>
    </div>
  </div>
  <p style="font-size:28px; line-height:1.4; color:#132238; background:#FFFFFE; border:1px dashed #898781; border-radius:12px; padding:20px 32px">And every day brings events: machine faults, overruns, no-shows, urgent add-ons and imaging holds, each of which should trigger a re-plan.</p>
  <div style="position:absolute; left:128px; right:128px; bottom:64px; display:flex; flex-direction:row; justify-content:space-between; gap:32px">
    <p style="font-size:24px; color:#5F6B7A">Rules confirmed by the department, 21 Sep 2026 · Assistive, not diagnostic · synthetic patients</p>
    <p style="font-size:24px; color:#5F6B7A; white-space:nowrap">3 / 8</p>
  </div>
  <aside>As the problem statement says, this is not appointment booking. It is dynamic allocation of machine time, staff and shared resources. The department confirmed these rules on 21 September: one breast board and one ABC unit with set reservations for the linac, the 17:00 hospital bus for MHRC patients, public transport home by 21:00, and patients reporting 20 minutes early, or 45 for pelvic patients. Every rule is configuration the department can change, not code.</aside>
</section></div></div><details class="notes"><summary>Speaker notes</summary><p>As the problem statement says, this is not appointment booking. It is dynamic allocation of machine time, staff and shared resources. The department confirmed these rules on 21 September: one breast board and one ABC unit with set reservations for the linac, the 17:00 hospital bus for MHRC patients, public transport home by 21:00, and patients reporting 20 minutes early, or 45 for pelvic patients. Every rule is configuration the department can change, not code.</p></details></figure>
<figure class="slide" id="s4" aria-label="Slide 4 of 8"><div class="frame"><div class="canvas"><section id="approaches" data-transition="push" style="background:#FCFCFB; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px">
  <div style="display:flex; flex-direction:column; gap:16px">
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#1C5CAB">Five approaches</p>
    <h2 style="font-family:'Source Serif 4', Georgia, serif; font-size:56px; font-weight:600; line-height:1.1; color:#132238">We compared five ways to build it</h2>
  </div>
  <table style="width:1664px; font-size:26px; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; border:1px solid #D9DFE6"><tr style="background:#EEF2F6"><th style="width:30%">Approach</th><th style="width:25%">Strength</th><th style="width:32%">Weakness</th><th style="width:13%">Score</th></tr><tr><td>Rule-based slot templates</td><td>Simple, transparent</td><td>Can't absorb variation or faults</td><td>3.10</td></tr><tr><td>LLM-only agent</td><td>Conversational</td><td>No guarantee on hard rules</td><td>2.60</td></tr><tr><td>Static optimisation</td><td>Guarantees hard rules</td><td>No learning or live recovery</td><td>3.60</td></tr><tr><td>Deep reinforcement learning</td><td>Adaptive in principle</td><td>Opaque; needs huge data</td><td>2.45</td></tr><tr style="background:#E3EEFB"><td>Hybrid (selected): predict, optimise, simulate, explain</td><td>Best of each technique</td><td>More parts, built in layers</td><td>4.85</td></tr></table>
  <p style="font-size:24px; line-height:1.4; color:#5F6B7A">Weighted score out of 5: safety and scope 20%, impact 20%, real-time 15%, feasibility 15%, explainability 10%, ease and languages 10%, configurability 10%.</p>
  <div style="position:absolute; left:128px; right:128px; bottom:64px; display:flex; flex-direction:row; justify-content:space-between; gap:32px">
    <p style="font-size:24px; color:#5F6B7A">RAD-SMART · Health-a-thon 2026 · Assistive, not diagnostic · synthetic patients, anonymised aggregates</p>
    <p style="font-size:24px; color:#5F6B7A; white-space:nowrap">4 / 8</p>
  </div>
  <aside>An LLM alone cannot promise that no new start runs past 17:00. A solver alone cannot learn, recover or talk to patients. The hybrid uses each technique where it is strongest, and it can be built in layers: the optimiser with average tables works on its own from week one.</aside>
</section></div></div><details class="notes"><summary>Speaker notes</summary><p>An LLM alone cannot promise that no new start runs past 17:00. A solver alone cannot learn, recover or talk to patients. The hybrid uses each technique where it is strongest, and it can be built in layers: the optimiser with average tables works on its own from week one.</p></details></figure>
<figure class="slide" id="s5" aria-label="Slide 5 of 8"><div class="frame"><div class="canvas"><section id="howitworks" data-transition="fade" style="background:#EEF2F6; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:32px">
  <div style="display:flex; flex-direction:column; gap:16px">
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#1C5CAB">The solution</p>
    <h2 style="font-family:'Source Serif 4', Georgia, serif; font-size:56px; font-weight:600; line-height:1.1; color:#132238">How RAD-SMART works, and who decides</h2>
  </div>
  <div style="display:flex; flex-direction:row; gap:24px">
      <div style="flex:1; display:flex; flex-direction:column; gap:12px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:26px 28px">
        <div style="height:8px; background:#2A78D6; border-radius:4px"></div>
        <p style="font-size:24px; font-weight:600; letter-spacing:1px; text-transform:uppercase; line-height:1.3; color:#1C5CAB">1 · Predict</p>
        <h3 style="font-family:'Source Serif 4', Georgia, serif; font-size:30px; font-weight:600; line-height:1.2; color:#132238">Minutes, not head-counts</h3>
        <p style="font-size:24px; line-height:1.4; color:#3B4654">Expected and cautious (P80) minutes per session, starting from the department's estimate table.</p>
        <div style="flex:1"></div>

  <aside>Ten more patients than the busiest recorded day, on the same machine. Faults are injected into each of the 300 days; the fair test of re-planning is the same RAD-SMART plan with and without it, and every deferral goes to the oncologist or senior RTT for approval. The typical wait stays about where it is, because every patient is asked to report 20 minutes early to prepare. What changes is the tail and punctuality: one patient in ten waits 76 minutes or more instead of 130, and only 6% are treated more than an hour late instead of 27%. Evening patients no longer wait three times as long as morning ones; morning patients wait a little longer than today, mostly the preparation time. With average tables alone the 90th percentile is already 82 minutes, so the department benefits before any session lengths are recorded. If patients keep coming as early as they do today, the 90th percentile is 110 minutes, still below 130. The plan holds 40 minutes for urgent starts and ends at about 01:03; holding nothing ends at 00:49, with a 90th percentile of 88 minutes. The department chooses.</aside>

<script>
(function () {
  var frames = Array.prototype.slice.call(document.querySelectorAll(".frame"));
  function fit() {
    frames.forEach(function (f) { f.firstElementChild.style.transform = "scale(" + (f.clientWidth / 1920) + ")"; });
  }
  window.addEventListener("resize", fit);
  fit();
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  document.addEventListener("keydown", function (ev) {
    var next = ev.key === "ArrowRight" || ev.key === "ArrowDown" || ev.key === "PageDown" || (ev.key === " " && !ev.shiftKey);
    var prev = ev.key === "ArrowLeft" || ev.key === "ArrowUp" || ev.key === "PageUp" || (ev.key === " " && ev.shiftKey);
    if (!next && !prev) return;
    var y = window.scrollY + 40, i = 0;
    slides.forEach(function (s, k) { if (s.offsetTop <= y) i = k; });
    var t = slides[Math.max(0, Math.min(slides.length - 1, i + (next ? 1 : -1)))];
    ev.preventDefault();
    window.scrollTo({ top: t.offsetTop - 16, behavior: "smooth" });
  });
})();
</script>
