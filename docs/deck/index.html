<figure class="slide" id="s2" aria-label="Slide 2 of 14"><div class="frame"><div class="canvas"><section id="problem" data-transition="fade" style="background:#FCFCFB; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px">
  <div style="display:flex; flex-direction:column; gap:16px">
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#1C5CAB">The problem</p>
    <h2 style="font-family:'Source Serif 4', Georgia, serif; font-size:56px; font-weight:600; line-height:1.1; color:#132238">Every weekday, 80 patients wait for one machine</h2>
  </div>
  <p style="font-size:34px; line-height:1.4; color:#3B4654">Appointment times are given by hand, without knowing how many machine-minutes each patient needs. Too many people are told to come at once, and they wait, every day of their course.</p>
  <div style="display:flex; flex-direction:row; gap:32px">
    <div style="flex:1; display:flex; flex-direction:column; gap:12px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:40px">
      <p style="font-family:'Source Serif 4', Georgia, serif; font-size:80px; font-weight:600; line-height:1.05; color:#132238">70–90</p>
      <p style="font-size:28px; line-height:1.4; color:#3B4654">patients treated on one machine every working day</p>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:12px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:40px">
      <p style="font-family:'Source Serif 4', Georgia, serif; font-size:80px; font-weight:600; line-height:1.05; color:#132238">5–7 weeks</p>
      <p style="font-size:28px; line-height:1.4; color:#3B4654">of daily visits for a curative course, usually with a caregiver</p>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:12px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:40px">
      <p style="font-family:'Source Serif 4', Georgia, serif; font-size:80px; font-weight:600; line-height:1.05; color:#132238">69%</p>
      <p style="font-size:28px; line-height:1.4; color:#3B4654">of India's 554 radiotherapy facilities have only one machine</p>
    </div>
  </div>
  <div style="position:absolute; left:128px; right:128px; bottom:64px; display:flex; flex-direction:row; justify-content:space-between; gap:32px">
    <p style="font-size:24px; color:#5F6B7A">Sources: RAD-SMART problem statement (Dr A. Dinesan); J Med Phys 2024, PubMed 39526149</p>
    <p style="font-size:24px; color:#5F6B7A; white-space:nowrap">2 / 14</p>
  </div>
  <aside>The pain is daily and repeated. A patient on a 25-fraction course who waits an extra hour a day loses about 25 hours, and so does the family member who comes along. Most Indian centres have one machine, so one bad day affects everyone.</aside>
</section></div></div><details class="notes"><summary>Speaker notes</summary><p>The pain is daily and repeated. A patient on a 25-fraction course who waits an extra hour a day loses about 25 hours, and so does the family member who comes along. Most Indian centres have one machine, so one bad day affects everyone.</p></details></figure>
<figure class="slide" id="s3" aria-label="Slide 3 of 14"><div class="frame"><div class="canvas"><section id="constraints" data-transition="fade" style="background:#EEF2F6; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px">
  <div style="display:flex; flex-direction:column; gap:16px">
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#1C5CAB">Why it is hard</p>
    <h2 style="font-family:'Source Serif 4', Georgia, serif; font-size:56px; font-weight:600; line-height:1.1; color:#132238">Allocation under hard rules and soft priorities</h2>
  </div>
  <div style="display:flex; flex-direction:row; gap:32px">
    <div style="flex:1; display:flex; flex-direction:column; gap:16px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:36px 40px">
      <h3 style="font-family:'Source Serif 4', Georgia, serif; font-size:34px; font-weight:600; line-height:1.2; color:#132238">Hard rules: never broken</h3>
      <ul style="font-size:28px; line-height:1.4; color:#3B4654"><li>New starts finish before 5 PM</li><li>SBRT, SRT, TBI and CSI inside the senior-staff window, 10 AM – 5 PM</li><li>Blood irradiation slot, 1:30 – 2 PM</li><li>Breast boards and ABC shared with the CT simulator</li><li>Versa HD and Halcyon capabilities</li><li>Capacity held for same-day urgent starts</li></ul>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; gap:16px; background:#FFFFFE; border:1px solid #D9DFE6; border-radius:12px; padding:36px 40px">
      <h3 style="font-family:'Source Serif 4', Georgia, serif; font-size:34px; font-weight:600; line-height:1.2; color:#132238">Soft priorities: traded off</h3>
      <ul style="font-size:28px; line-height:1.4; color:#3B4654"><li>Elderly and public-transport patients earlier</li><li>Inpatient, hospice and dormitory time windows</li><li>Paying-patient preference, as the department sets it</li><li>Complex cases in the 12:00 – 1:30 protected block</li><li>As little overtime as possible</li></ul>
    </div>
  </div>
  <p style="font-size:28px; line-height:1.4; color:#132238; background:#FFFFFE; border:1px dashed #898781; border-radius:12px; padding:20px 32px">And every day brings events: machine faults, overruns, no-shows and urgent add-ons, each of which should trigger a re-plan.</p>
  <div style="position:absolute; left:128px; right:128px; bottom:64px; display:flex; flex-direction:row; justify-content:space-between; gap:32px">
    <p style="font-size:24px; color:#5F6B7A">RAD-SMART · Health-a-thon 2026 · Assistive, not diagnostic · synthetic data</p>
    <p style="font-size:24px; color:#5F6B7A; white-space:nowrap">3 / 14</p>
  </div>
  <aside>As the problem statement says, this is not appointment booking. It is dynamic allocation of machine time, staff and shared resources. Every rule on this slide is configuration the department can change, not code.</aside>
</section></div></div><details class="notes"><summary>Speaker notes</summary><p>As the problem statement says, this is not appointment booking. It is dynamic allocation of machine time, staff and shared resources. Every rule on this slide is configuration the department can change, not code.</p></details></figure>
<figure class="slide" id="s4" aria-label="Slide 4 of 14"><div class="frame"><div class="canvas"><section id="approaches" data-transition="push" style="background:#FCFCFB; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; padding:128px 128px 160px; display:flex; flex-direction:column; gap:40px">
  <div style="display:flex; flex-direction:column; gap:16px">
    <p style="font-size:24px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#1C5CAB">Five approaches</p>
    <h2 style="font-family:'Source Serif 4', Georgia, serif; font-size:56px; font-weight:600; line-height:1.1; color:#132238">We compared five ways to build it</h2>
  </div>
  <table style="width:1664px; font-size:26px; color:#3B4654; font-family:'IBM Plex Sans', Arial, sans-serif; border:1px solid #D9DFE6"><tr style="background:#EEF2F6"><th style="width:30%">Approach</th><th style="width:25%">Strength</th><th style="width:32%">Weakness</th><th style="width:13%">Score</th></tr><tr><td>Rule-based slot templates</td><td>Simple, transparent</td><td>Can't absorb variation or faults</td><td>3.10</td></tr><tr><td>LLM-only agent</td><td>Conversational</td><td>No guarantee on hard rules</td><td>2.60</td></tr><tr><td>Static optimisation</td><td>Guarantees hard rules</td><td>No learning or live recovery</td><td>3.60</td></tr><tr><td>Deep reinforcement learning</td><td>Adaptive in principle</td><td>Opaque; needs huge data</td><td>2.45</td></tr><tr style="background:#E3EEFB"><td>Hybrid (selected): predict, optimise, simulate, explain</td><td>Best of each technique</td><td>More parts, built in layers</td><td>4.85</td></tr></table>
  <p style="font-size:24px; line-height:1.4; color:#5F6B7A">Weighted score out of 5: safety and scope 20%, impact 20%, real-time 15%, feasibility 15%, explainability 10%, ease and languages 10%, configurability 10%.</p>
  <div style="position:absolute; left:128px; right:128px; bottom:64px; display:flex; flex-direction:row; justify-content:space-between; gap:32px">
    <p style="font-size:24px; color:#5F6B7A">RAD-SMART · Health-a-thon 2026 · Assistive, not diagnostic · synthetic data</p>
    <p style="font-size:24px; color:#5F6B7A; white-space:nowrap">4 / 14</p>
  </div>
  <aside>An LLM alone cannot promise that no new start runs past 5 PM. A solver alone cannot learn, recover or talk to patients. The hybrid uses each technique where it is strongest, and it can be built in layers: the optimiser with average tables works on its own from week one.</aside>
</section></div></div><details class="notes"><summary>Speaker notes</summary><p>An LLM alone cannot promise that no new start runs past 5 PM. A solver alone cannot learn, recover or talk to patients. The hybrid uses each technique where it is strongest, and it can be built in layers: the optimiser with average tables works on its own from week one.</p></details></figure>
