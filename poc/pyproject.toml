[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radsmart"
version = "0.2.0"
description = "RAD-SMART scheduling engine: duration prediction, MILP day planning, standing slots, breakdown triage and the digital twin"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.0"]

[project.optional-dependencies]
poc = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["radsmart"]
